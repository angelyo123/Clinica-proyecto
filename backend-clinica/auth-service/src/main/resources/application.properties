# --- Datos generales ---
spring.application.name=auth-service
server.port=8081

# --- Base de datos ---
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica_auth
spring.datasource.username=postgres
spring.datasource.password=post
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Seguridad JWT ---
jwt.secret=clave-super-secreta-compartida
jwt.expiration=86400000   # 24 horas

# --- si esta en true todo se permite, si esta en false regresa la seguridad ---
