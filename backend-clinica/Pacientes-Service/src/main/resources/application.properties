spring.application.name=Pacientes-Service
server.port=8082

# --- Base de datos ---
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica_pacientes
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Seguridad JWT (mismo secreto que auth) ---
jwt.secret=clave-super-secreta-compartida

# --- Comunicaci�n con otros servicios ---
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

