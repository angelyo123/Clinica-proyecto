<div class="max-w-3xl mx-auto p-6">
  <h2 class="text-2xl font-bold text-gray-800 mb-4">💬 Asistente Virtual de Citas</h2>

  <p class="text-gray-600 mb-6">
    Bienvenido a tu asistente médico inteligente 🤖.  
    Aquí puedes <strong>consultar médicos, horarios y reservar citas automáticamente</strong> solo con escribirlo.
  </p>
  

  <div class="bg-white border rounded-xl shadow-lg h-[60vh] flex flex-col p-4 overflow-y-auto">
    <div *ngFor="let msg of mensajes" class="mb-4 flex" [ngClass]="{
      'justify-end': msg.remitente === 'paciente',
      'justify-start': msg.remitente === 'ia'
    }">
      <div [ngClass]="{
        'bg-blue-600 text-white': msg.remitente === 'paciente',
        'bg-gray-100 text-gray-800': msg.remitente === 'ia'
      }" class="max-w-[75%] p-3 rounded-2xl shadow">
        <pre class="whitespace-pre-wrap">{{ msg.texto }}</pre>
      </div>
    </div>

    <div *ngIf="cargando" class="text-gray-500 italic text-center mt-auto">
      🤖 Escribiendo...
    </div>
  </div>

  <!-- Entrada -->
  <div class="mt-4 flex items-center gap-2">
    <input
      [(ngModel)]="mensajeUsuario"
      (keyup.enter)="enviarMensaje()"
      type="text"
      placeholder="Escribe tu mensaje..."
      class="flex-1 border rounded-lg p-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />

    <button
      (click)="enviarMensaje()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow transition">
      Enviar
    </button>
  </div>
</div>
