<div class="max-w-6xl mx-auto p-6 bg-gray-50 rounded-xl shadow-sm border border-gray-200">
  <!-- 🧭 Encabezado -->
  <div class="flex justify-between items-center mb-8">
    <h2 class="text-3xl font-bold text-gray-800">👨‍⚕️ Médicos Disponibles</h2>
    <button
      class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg shadow-sm transition"
      routerLink="/paciente/mis-citas">
      ← Volver a mis citas
    </button>
  </div>

  <!-- 💬 Mensajes -->
  <div *ngIf="loading" class="text-gray-500 italic">Cargando médicos...</div>
  <div *ngIf="error" class="text-red-600 font-semibold">{{ error }}</div>
  <div *ngIf="!loading && medicos.length === 0" class="text-gray-600">
    No hay médicos registrados actualmente.
  </div>

  <!-- 👨‍⚕️ Tarjetas de médicos -->
  <div *ngIf="!loading && medicos.length > 0" class="grid sm:grid-cols-2 md:grid-cols-3 gap-6">
    <div *ngFor="let medico of medicos"
         class="card-medico bg-white border border-gray-200 rounded-xl p-5 hover:shadow-md hover:border-blue-300 transition cursor-pointer">

      <h3 class="text-xl font-semibold text-blue-700 mb-1">{{ medico.nombre }}</h3>
      <p class="text-gray-700 font-medium">🩺 {{ medico.especialidad }}</p>
      <p class="text-sm text-gray-500 mt-1">📞 {{ medico.telefono || 'Sin teléfono' }}</p>

      <div class="mt-4">
        <button
          class="btn-reservar"
          [routerLink]="['/paciente/crear-cita']"
          [queryParams]="{ medicoId: medico.id }">
          ➕ Reservar cita
        </button>
      </div>
    </div>
  </div>
</div>
